# --- 描画・デザイン設定 ---
draw_config:
  dark_mode: true          # シックなダークテーマ
  draw_key_sides: true     # キーキャップの立体感を描画
  key_rx: 8.0              # キーの角丸サイズ
  key_ry: 8.0
  svg_extra_style: |
    /* 洗練されたモダンフォント */
    svg.keymap {
      font-family: "Inter", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
      font-weight: 600;
    }
    /* trans（外周の不要キー）の枠のみ消去（※ none は表示を残す） */
    .key.trans,
    g.key.trans {
      display: none !important;
    }

# --- パース・表記設定 ---
parse_config:
  zmk_keycode_map:
    # --- 画像内テキストの簡略化（パース結果文字列ダイレクト指定） ---
    "Ctl+W": "Ctrl W"
    "Ctl+T": "Ctrl T"
    "Ctl+L": "Ctrl L"
    "Ctl+TAB": "Tab ►"
    "Ctl+Sft+TAB": "Tab ◄"

    "Gui+LEFT": "Win ◄"
    "Gui+UP": "Win ▲"
    "Gui+RIGHT": "Win ►"
    "Gui+DOWN": "Win ▼"
    "Sft+Gui+LEFT": "⇧ Win ◄"
    "Gui+Alt+LEFT": "Win Alt ◄"
    "Gui+Alt+DOWN": "Win Alt ▼"
    "Gui+Alt+RIGHT": "Win Alt ►"
    "Sft+Gui+RIGHT": "⇧ Win ►"

    "Gui+W": "Cmd W"
    "Gui+T": "Cmd T"
    "Gui+R": "Cmd R"
    "Gui+H": "Cmd H"
    "Gui+L": "Cmd L"
    "Gui+]": "Cmd ]"
    "Gui+[": "Cmd ["

    # --- 記号・Shift複合 ---
    "Sft+/": "?"
    "Sft+1": "!"
    'Sft+"': "&quot;"
    "Sft+DQT": "&quot;"
    "Sft+~": "~"

    SQT: "'"
    SINGLE_QUOTE: "'"
    APOS: "'"
    DQT: "&quot;"
    DOUBLE_QUOTE: "&quot;"
    LT: "&lt;"
    GT: "&gt;"

    # --- マクロ / マウスボタン短縮 ---
    "&mkp MB5": "MB5"
    "&mkp MB4": "MB4"
    "&m_ipad_left": "iPad ◄"
    "&m_ipad_full": "iPad 🔲"
    "&m_ipad_right": "iPad ►"
    "&m_globe_up": "🌐 ▲"

    # --- 予備：ZMK生コード表記マッピング ---
    LC(W): "Ctrl W"
    LC(T): "Ctrl T"
    LC(L): "Ctrl L"
    LC(TAB): "Tab ►"
    LC(LS(TAB)): "Tab ◄"
    LG(LEFT): "Win ◄"
    LG(UP): "Win ▲"
    LG(RIGHT): "Win ►"
    LG(DOWN): "Win ▼"
    LG(W): "Cmd W"
    LG(T): "Cmd T"
    LG(R): "Cmd R"
    LG(H): "Cmd H"
    LG(L): "Cmd L"
    LG(RBKT): "Cmd ]"
    LG(LBKT): "Cmd ["
    LS(TILDE): "~"

    # --- 基本記号 ---
    MINUS: "-"
    EQUAL: "="
    COMMA: ","
    DOT: "."
    FSLH: "/"
    BSLH: "\\"
    SEMI: ";"
    SEMICOLON: ";"
    COLON: ":"
    HASH: "#"
    AT: "@"
    DLLR: "$"
    DOLLAR: "$"
    PRCNT: "%"
    PERCENT: "%"
    AMPS: "&amp;"
    AMPERSAND: "&amp;"
    CARET: "^"
    GRAVE: "`"
    TILDE: "~"
    EXCL: "!"
    QMARK: "?"
    PLUS: "+"
    ASTERISK: "*"
    ASTRK: "*"
    LBKT: "["
    RBKT: "]"
    LPAR: "("
    RPAR: ")"
    LBRC: "{"
    RBRC: "}"

    # --- テンキー（KP）系 ---
    KP_MULTIPLY: "*"
    "KP MULTIPLY": "*"
    KP_PLUS: "+"
    "KP PLUS": "+"
    KP_DIVIDE: "/"
    "KP DIVIDE": "/"
    KP_MINUS: "-"
    "KP MINUS": "-"
    KP_DOT: "."
    "KP DOT": "."
    KP_EQUAL: "="

    # --- 矢印キー ---
    UP: "↑"
    DOWN: "↓"
    LEFT: "←"
    RIGHT: "→"

    # --- 特殊キー ---
    BSPC: "⌫"
    RET: "⏎"
    ENTER: "⏎"
    SPACE: "␣"
    TAB: "⇥"
    ESC: "Esc"

    # --- Shift複合記号 ---
    Sft+SEMICOLON: "+"
    Sft+SEMI: "+"
