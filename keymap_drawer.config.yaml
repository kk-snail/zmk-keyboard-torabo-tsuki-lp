# --- 描画・デザイン設定 ---
draw_config:
  dark_mode: true          # シックなダークテーマを有効化
  draw_key_sides: true     # キーキャップの立体感（側面）を描画
  key_rx: 8.0              # キーの角丸サイズ
  key_ry: 8.0
  svg_extra_style: |
    /* 洗練されたモダンフォントを適用 */
    svg.keymap {
      font-family: "Inter", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
      font-weight: 600;
    }
    /* 物理的に使用していない外周キー (trans) を枠ごと消去 */
    g.trans, rect.trans,{
      display: none !important;
    }

# --- パース・表記設定 ---
parse_config:
  trans_legend: ""         # 未割り当てキーの「▽」記号を非表示化

  zmk_keycode_map:
    # --- 独自マクロ・マウス・特殊ボタン ---
    "&mkp MB5": "MB5 (進む)"
    "&mkp MB4": "MB4 (戻る)"
    "&m_ipad_left": "iPad ◄"
    "&m_ipad_full": "iPad 🔲"
    "&m_ipad_right": "iPad ►"
    "&m_globe_up": "🌐 ▲"

    # --- ショートカット / 複合修飾キー ---
    LC(LS(TAB)): "Tab ◄"
    LC(TAB): "Tab ►"
    LG(LEFT): "Win ◄"
    LG(RIGHT): "Win ►"
    LG(UP): "Win ▲"
    LG(DOWN): "Win ▼"
    LG(W): "Cmd W"
    LG(T): "Cmd T"
    LG(R): "Cmd R"
    LG(H): "Cmd H"
    LG(L): "Cmd L"
    LS(TILDE): "~"

    Sft+Gui+LEFT: "⇧ Win ◄"
    Gui+Alt+LEFT: "Win Alt ◄"
    Gui+Alt+DOWN: "Win Alt ▼"
    Gui+Alt+RIGHT: "Win Alt ►"
    Sft+Gui+RIGHT: "⇧ Win ►"

    # カッコ・ショートカット
    Gui+RBKT: "Cmd ]"
    Gui+LBKT: "Cmd ["

    # --- 基本記号 ---
    MINUS: "-"
    EQUAL: "="
    COMMA: ","
    DOT: "."
    FSLH: "/"
    BSLH: "\\"
    SEMI: ";"
    SEMICOLON: ";"
    COLON: ":"
    HASH: "#"
    AT: "@"
    DLLR: "$"
    DOLLAR: "$"
    PRCNT: "%"
    PERCENT: "%"
    AMPS: "&"
    AMPERSAND: "&"
    CARET: "^"
    GRAVE: "`"
    TILDE: "~"
    EXCL: "!"
    QMARK: "?"
    PLUS: "+"
    ASTERISK: "*"
    ASTRK: "*"
    LBKT: "["
    RBKT: "]"
    LPAR: "("
    RPAR: ")"
    LBRC: "{"
    RBRC: "}"

    # --- テンキー（KP）系 ---
    KP_MULTIPLY: "*"
    "KP MULTIPLY": "*"
    KP_PLUS: "+"
    "KP PLUS": "+"
    KP_DIVIDE: "/"
    "KP DIVIDE": "/"
    KP_MINUS: "-"
    "KP MINUS": "-"
    KP_DOT: "."
    "KP DOT": "."
    KP_EQUAL: "="

    # --- 矢印キー ---
    UP: "↑"
    DOWN: "↓"
    LEFT: "←"
    RIGHT: "→"

    # --- 特殊キー ---
    BSPC: "⌫"
    RET: "⏎"
    ENTER: "⏎"
    SPACE: "␣"
    TAB: "⇥"
    ESC: "Esc"

    # --- Shift複合記号 ---
    Sft+FSLH: "?"
    Sft+SEMICOLON: "+"
    Sft+SEMI: "+"
